<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://raqim-chat-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myId = 'user-' + Math.floor(Math.random() * 9000 + 1000);
    let currentRoom = 'raqim-global-room';
    let messagesRef = null;

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('myIdText').textContent = currentRoom;
        initChatRoom(currentRoom);

        // ربط الأزرار برمجياً لضمان عدم تعطلها
        document.querySelector('.fa-user-plus').addEventListener('click', openAddFriendModal);
        document.querySelector('.fa-fingerprint').addEventListener('click', openMyIdModal);
        document.querySelector('.fa-phone').addEventListener('click', () => startCall('audio'));
        document.querySelector('.fa-video').addEventListener('click', () => startCall('video'));
        document.querySelector('.fa-power-off').addEventListener('click', exitApp);
    });

    function initRoomMessages(roomName) {
        messagesRef = ref(db, 'rooms/' + roomName);
        onChildAdded(messagesRef, (snapshot) => {
            let data = snapshot.val();
            if (data && data.sender !== myId) {
                appendMessage(data.content, 'received', data.isMedia);
            }
        });
    }

    function initChatRoom(room) {
        initRoomMessages(room);
    }

    function openMyIdModal() { document.getElementById('myIdModal').style.display = 'flex'; }
    function openAddFriendModal() { document.getElementById('addFriendModal').style.display = 'flex'; }
    
    window.closeModals = function() {
        document.getElementById('myIdModal').style.display = 'none';
        document.getElementById('addFriendModal').style.display = 'none';
    }

    window.copyMyId = function() {
        navigator.clipboard.writeText(currentRoom).then(() => alert('تم نسخ كود الغرفة!'));
    }

    window.joinRoom = function() {
        const roomInput = document.getElementById('friendIdInput').value.trim();
        if (!roomInput) return alert('أدخل كود الغرفة بشكل صحيح');
        currentRoom = roomInput;
        document.getElementById('myIdText').textContent = currentRoom;
        document.getElementById('currentChatName').textContent = 'غرفة: ' + currentRoom;
        document.getElementById('messagesContainer').innerHTML = '';
        window.closeModals();
        appendSystemMessage('تم الانتقال بنجاح إلى الغرفة: ' + currentRoom);
        document.getElementById('friendIdInput').value = '';
        initChatRoom(currentRoom);
    }

    window.sendMessage = function() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        let messagePayload = {
            sender: myId,
            content: text,
            isMedia: false,
            time: Date.now()
        };

        if (messagesRef) {
            push(messagesRef, messagePayload);
        }

        appendMessage(text, 'sent');
        input.value = '';
    }

    window.handleKeyPress = function(e) { if (e.key === 'Enter') sendMessage(); }

    window.sendFile = function(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            let tag = `<img src="${e.target.result}" />`;
            let payload = {
                sender: myId,
                content: tag,
                isMedia: true,
                time: Date.now()
            };
            if (messagesRef) {
                push(messagesRef, payload);
            }
            appendMessage(tag, 'sent', true);
        };
        reader.readAsDataURL(file);
    }

    function appendMessage(content, type, isMedia = false) {
        const container = document.getElementById('messagesContainer');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        if (isMedia) msgDiv.innerHTML = content;
        else msgDiv.textContent = content;

        const deleteBtn = document.createElement('span');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i> مسح';
        deleteBtn.onclick = () => msgDiv.remove();
        msgDiv.appendChild(deleteBtn);

        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function appendSystemMessage(text) {
        const container = document.getElementById('messagesContainer');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg system';
        msgDiv.textContent = text;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    function exitApp() {
        if (confirm("إغلاق التطبيق؟")) window.location.href = "about:blank";
    }

    let mediaRecorder, chunks = [], recording = false;
    window.toggleRecord = async function() {
        const btn = document.getElementById('recordBtn');
        if (!recording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        let tag = `<audio controls src="${e.target.result}"></audio>`;
                        let payload = { sender: myId, content: tag, isMedia: true, time: Date.now() };
                        if (messagesRef) push(messagesRef, payload);
                        appendMessage(tag, 'sent', true);
                    };
                    reader.readAsDataURL(blob);
                    chunks = [];
                };
                mediaRecorder.start();
                recording = true;
                btn.style.color = 'red';
            } catch(e) { alert('الميكروفون غير متاح'); }
        } else {
            mediaRecorder.stop();
            recording = false;
            btn.style.color = '#54656f';
        }
    }

    function startCall(t) { document.getElementById('callOverlay').style.display = 'flex'; }
    window.endCall = function() { document.getElementById('callOverlay').style.display = 'none'; }
</script>
